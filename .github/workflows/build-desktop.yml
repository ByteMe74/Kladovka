# Тесты и сборка десктопной версии.
#
# Отдельный workflow по той же причине, что и build-android.yml: свой бейдж
# вместо общего, чтобы было видно, какой модуль упал, без входа в GitHub.
#
# Compose Desktop тянет за собой Skiko, которому нужна графическая подсистема.
# На раннере её нет, поэтому тесты идут под xvfb с headless-флагом: виртуальный
# дисплей вместо настоящего.

name: Build Desktop

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ставим JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-desktop-${{ hashFiles('desktop/**/*.gradle*', 'desktop/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-desktop-

      - name: Тесты
        working-directory: desktop
        run: |
          chmod +x gradlew
          xvfb-run --auto-servernum ./gradlew test --stacktrace -Djava.awt.headless=true

      - name: Сборка
        working-directory: desktop
        run: |
          chmod +x gradlew
          xvfb-run --auto-servernum ./gradlew jar --stacktrace -Djava.awt.headless=true

      # Как и в Android: зелёный бейдж без проверяемого артефакта ничего не
      # доказывает. Jar обязан существовать, и он прикладывается наружу.
      - name: Что получилось
        run: |
          set -euo pipefail
          found=0
          for jar in desktop/*/build/libs/*.jar desktop/build/libs/*.jar; do
            [ -e "$jar" ] || continue
            ls -l "$jar"
            found=1
          done
          [ "$found" = 1 ] || {
            echo "::error::jar не собран: в build/libs пусто"
            find desktop -name '*.jar' -path '*build*' 2>&1 | head -10
            exit 1
          }

      - name: Прикладываю jar
        uses: actions/upload-artifact@v4
        with:
          name: kladovka-jars
          path: |
            desktop/*/build/libs/*.jar
            desktop/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Если упало — окружение в аннотации
        if: failure()
        run: |
          echo "::error::Desktop: сборка упала"
          echo "::error::java: $(java -version 2>&1 | head -1)"
          echo "::error::xvfb: $(command -v xvfb-run || echo 'не найден')"