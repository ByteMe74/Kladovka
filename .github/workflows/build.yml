# Сборка и тесты.
#
# Зачем этот файл. Форма SignPath Foundation требует указать систему сборки,
# и условия сертификата требуют, чтобы артефакты собирались в CI из исходников
# этого репозитория. Без этого файла обещание в заявке было бы неправдой.
#
# Что здесь НЕ делается намеренно: подпись. Ключ Android не лежит в репозитории
# и не кладётся в секреты GitHub - он нужен только на машине мейнтейнера и в
# облачной копии. CI собирает и проверяет; подписанный релиз выходит локально.
# Пересоздать ключ нельзя: новая подпись ломает обновление у всех, кто уже
# поставил приложение (см. CODE_SIGNING_POLICY.md).
#
# Про chmod: git на Windows не хранит бит исполнения, поэтому gradlew приезжает
# без него, и первый прогон упал с кодом 126. Бит выставлен и в индексе, и
# здесь - на случай, если репозиторий склонировали иначе.

name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ставим JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ставим Android SDK
        uses: android-actions/setup-android@v3

      # Компоненты SDK перечислены явно. По умолчанию ставится «последнее»,
      # и однажды это «последнее» перестаёт совпадать с compileSdk - сборка
      # падает с сообщением, которое не прочитаешь, не зная деталей.
      - name: Компоненты Android SDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-

      - name: Тесты
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew test --stacktrace

      # Сборка без ключа подписи: assembleRelease упадёт на отсутствии
      # storePassword, а debug-сборка доказывает, что код компилируется целиком.
      - name: Сборка APK (без подписи)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Что получилось
        run: |
          find android/app/build/outputs -name '*.apk' -exec ls -l {} \;

      # Аннотация видна на странице прогона без входа в GitHub, поэтому при
      # сбое причина попадает в интерфейс, а не остаётся в логах.
      - name: Если упало — причина в аннотации
        if: failure()
        run: |
          {
            echo "::error::Android: сборка упала. Состояние окружения:"
            echo "::error::JAVA_HOME=$JAVA_HOME ANDROID_HOME=$ANDROID_HOME"
            echo "::error::java: $(java -version 2>&1 | head -1)"
            echo "::error::platforms: $(ls "$ANDROID_HOME/platforms" 2>&1 | tr '\n' ' ')"
            echo "::error::build-tools: $(ls "$ANDROID_HOME/build-tools" 2>&1 | tr '\n' ' ')"
          } 2>&1 | grep '::error::' || true

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ставим JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-desktop-${{ hashFiles('desktop/**/*.gradle*', 'desktop/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-desktop-

      # Compose Desktop тянет Skiko, которому нужна графическая подсистема. На
      # сервере GitHub её нет, и код, проверяющий только данные, всё равно может
      # дойти до инициализации окна. xvfb даёт виртуальный дисплей вместо
      # настоящего, а headless-флаг не даёт библиотеке искать X-сервер.
      - name: Тесты
        working-directory: desktop
        run: |
          chmod +x gradlew
          xvfb-run --auto-servernum ./gradlew test --stacktrace -Djava.awt.headless=true

      - name: Сборка
        working-directory: desktop
        run: |
          chmod +x gradlew
          xvfb-run --auto-servernum ./gradlew jar --stacktrace -Djava.awt.headless=true

      - name: Если упало — причина в аннотации
        if: failure()
        run: |
          {
            echo "::error::Desktop: сборка упала. Состояние окружения:"
            echo "::error::java: $(java -version 2>&1 | head -1)"
            echo "::error::DISPLAY=${DISPLAY:-нет} xvfb: $(command -v xvfb-run || echo 'не найден')"
          } 2>&1 | grep '::error::' || true

  shell-scripts:
    name: Скрипты сервера
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Проверка синтаксиса .sh. Некорректный перенос строки в скрипте на
      # сервере молча ломает расписание, и монитор об этом не сообщает - такой
      # случай уже был. Проверка ловит это до выкладки.
      - name: bash -n для всех серверных скриптов
        run: |
          set -e
          found=0
          for f in android/ops/*.sh; do
            [ -e "$f" ] || continue
            echo "проверяю $f"
            bash -n "$f"
            # Shebang обязан быть в первой строке и без CR - иначе Linux
            # не запустит файл, а Windows его запишет.
            head -1 "$f" | grep -q $'\r' && { echo "CR в shebang: $f"; exit 1; }
            head -1 "$f" | grep -q '^#!' || { echo "нет shebang: $f"; exit 1; }
            found=1
          done
          [ "$found" = 1 ] || { echo "не нашлось ни одного .sh"; exit 1; }

      - name: Нет символа CR в файлах, где он ломает выполнение
        run: |
          set -e
          bad=0
          for f in android/ops/*.sh android/*.php; do
            [ -e "$f" ] || continue
            if grep -q $'\r' "$f"; then echo "CR найден: $f"; bad=1; fi
          done
          [ "$bad" = 0 ] || exit 1
          echo "CR не найден"

      - name: PHP-синтаксис серверных файлов
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli >/dev/null
          for f in android/*.php; do
            [ -e "$f" ] || continue
            echo "проверяю $f"
            php -l "$f"
          done

      - name: Если упало — причина в аннотации
        if: failure()
        run: |
          echo "::error::Скрипты сервера: проверка упала"