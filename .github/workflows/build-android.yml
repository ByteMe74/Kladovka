# Сборка и тесты Android-приложения.
#
# Отдельным workflow по той же причине, что и остальные: свой бейдж вместо
# общего, чтобы было видно, что именно сломалось, без входа в GitHub.
#
# SDK берётся из кэша, который наполняет workflow Android SDK. Раньше он ставился
# здесь же, через android-actions/setup-android, и джоб падал за 22 секунды —
# раньше, чем начиналась сборка. Разделение вынесло установку в отдельный бейдж:
# видно, где именно поломка.
#
# Про подпись: ключ Android не лежит в репозитории и не кладётся в секреты
# GitHub — он нужен только на машине мейнтейнера и в облачной копии. CI собирает
# и проверяет, подписанный релиз выходит локально. Пересоздать ключ нельзя:
# новая подпись ломает обновление у всех, кто уже поставил приложение.

name: Build Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ставим JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: "SDK: из кэша или ставим сами"
        run: |
          set -euo pipefail
          export ANDROID_HOME="$PWD/.android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          # Кэш наполняет workflow Android SDK, но полагаться на него нельзя:
          # он запускается не на каждый push, и если он откажет или попадёт под
          # paths-фильтр, сборка останется без SDK. Поэтому при отсутствии
          # кэша ставим всё сами — шаг виден целиком, в отличие от логов.
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "кэша нет, ставлю SDK"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/tools.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q "$RUNNER_TEMP/tools.zip" -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          else
            echo "беру SDK из кэша"
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::нет sdkmanager"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          # Файла нет в репозитории, он в .gitignore. Пишется и в переменные
          # окружения, и в local.properties: AGP ищет путь по своим правилам,
          # и одной переменной окружения ему недостаточно — на сервере он так и
          # ответил «SDK location not found».
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "::error::после установки нет platforms/android-35"
            ls "$ANDROID_HOME/platforms" 2>&1 | tr '\n' ' '
            exit 1
          }
          echo "platforms: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-

      - name: Тесты
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew test --stacktrace

      # Сборка без ключа подписи: assembleRelease упал бы на отсутствии
      # storePassword, а debug-сборка доказывает, что код компилируется целиком.
      - name: Сборка APK (без подписи)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Что получилось
        run: |
          set -euo pipefail
          # Шаг с find тут стоял и молчал: find завершается успехом и когда
          # ничего не нашёл, поэтому сборка могла остаться зелёной, не
          # создав ни одного APK. Теперь отсутствие файла - ошибка.
          found=0
          for apk in android/app/build/outputs/apk/debug/*.apk; do
            [ -e "$apk" ] || continue
            ls -l "$apk"
            found=1
          done
          [ "$found" = 1 ] || {
            echo "::error::APK не собран: в android/app/build/outputs/apk/debug пусто"
            ls -laR android/app/build/outputs 2>&1 | head -20
            exit 1
          }

      # Артефакт выкладывается наружу, чтобы зелёный бейдж можно было проверить,
      # а не только поверить. Скачать его может любой, у кого есть доступ к
      # публичному репозиторию, - ровно это и нужно для подписи по правилам
      # SignPath: артефакт должен быть получен из сборки в CI.
      - name: Прикладываю APK
        uses: actions/upload-artifact@v4
        with:
          name: kladovka-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Аннотация читается на странице прогона без входа — в отличие от логов.
      - name: Если упало — окружение в аннотации
        if: failure()
        run: |
          echo "::error::Android: сборка упала"
          echo "::error::java: $(java -version 2>&1 | head -1)"
          echo "::error::ANDROID_HOME=${ANDROID_HOME:-нет}"
          echo "::error::platforms: $(ls "$ANDROID_HOME/platforms" 2>&1 | tr '\n' ' ')"
          echo "::error::build-tools: $(ls "$ANDROID_HOME/build-tools" 2>&1 | tr '\n' ' ')"
          echo "::error::local.properties: $(cat android/local.properties 2>&1)"
