# Сборка и тесты Android-приложения.
#
# Зачем отдельным файлом, а не вместе с остальным. Логи GitHub Actions видны
# только после входа, а бейдж — без него. С тремя модулями в одном прогоне общий
# бейдж отвечает на вопрос «сломалось ли что-нибудь», но не на вопрос «что
# именно»: прогон падал трижды подряд, и каждый раз это было видно только
# по факту. У каждого модуля теперь свой бейдж, и виноватый находится сразу.
#
# Про подпись: ключ Android не лежит в репозитории и не кладётся в секреты
# GitHub - он нужен только на машине мейнтейнера и в облачной копии. CI собирает
# и проверяет, подписанный релиз выходит локально. Пересоздать ключ нельзя:
# новая подпись ломает обновление у всех, кто уже поставил приложение.

name: Build Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ставим JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ставим Android SDK
        uses: android-actions/setup-android@v3

      # Компоненты перечислены явно: по умолчанию ставится «последнее», и рано
      # или поздно оно перестаёт совпадать с compileSdk из build.gradle.kts.
      #
      # И sdk.dir записывается в local.properties, хотя ANDROID_HOME и должен
      # хватать. Без этого прогон падал с «SDK location not found»: AGP ищет
      # путь по разным правилам в зависимости от версии и от того, как именно
      # установлен SDK, и полагаться на переменную окружения оказалось
      # недостаточно. Файл не коммитится - он в .gitignore.
      - name: Компоненты Android SDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          echo "записан sdk.dir=$ANDROID_HOME"
          echo "platforms: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-

      - name: Тесты
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew test --stacktrace

      # Сборка без ключа подписи: assembleRelease упал бы на отсутствии
      # storePassword, а debug-сборка доказывает, что код компилируется целиком.
      - name: Сборка APK (без подписи)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Что получилось
        run: |
          find android/app/build/outputs -name '*.apk' -exec ls -l {} \;

      # Аннотация читается на странице прогона без входа — в отличие от логов.
      - name: Если упало — окружение в аннотации
        if: failure()
        run: |
          echo "::error::Android: сборка упала"
          echo "::error::java: $(java -version 2>&1 | head -1)"
          echo "::error::ANDROID_HOME=$ANDROID_HOME"
          echo "::error::platforms: $(ls "$ANDROID_HOME/platforms" 2>&1 | tr '\n' ' ')"
          echo "::error::build-tools: $(ls "$ANDROID_HOME/build-tools" 2>&1 | tr '\n' ' ')"